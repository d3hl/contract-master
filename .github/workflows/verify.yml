name: Verify Contract Master
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Test-only: cross-checks the built-in validator against a standard one.
      - run: python -m pip install jsonschema==4.23.0
      - run: python -m unittest discover -s tests -v
      - run: python -m contract_master doctor
