name: Verify Contract Master
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    # Keep the job names "unit (3.9)" and "unit (3.13)": branch protection requires them.
    name: unit (${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Workers run RHEL 9 python3 (3.9). ubuntu-latest (26.04) has no 3.9 build.
          - python: '3.9'
            os: ubuntu-24.04
          - python: '3.13'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Test-only: cross-checks the built-in validator against a standard one.
      - run: python -m pip install jsonschema==4.23.0
      - run: python -m unittest discover -s tests -v
      - run: python -m contract_master doctor
